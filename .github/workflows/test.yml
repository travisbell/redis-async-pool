name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]

    steps:
      - uses: actions/checkout@v4
      # The same disposable standalone server and three-node cluster as local development.
      - name: Start Redis
        run: |
          docker compose up -d
          for i in $(seq 1 30); do docker compose exec -T redis redis-cli ping | grep -q PONG && break; sleep 1; done
          for i in $(seq 1 60); do docker compose exec -T redis-cluster redis-cli -p 6391 cluster info | grep -q cluster_state:ok && break; sleep 1; done
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
      - run: POOL=connection_pool bundle exec rspec spec/conformance
      - run: bundle exec rake lint
      - run: POOL=connection_pool bundle exec rake lint

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop
